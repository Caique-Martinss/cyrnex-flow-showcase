# CYRNEX FLOW — Render Blueprint
# Objetivo: deixar staging/producao reproduziveis sem cadastrar servicos manualmente do zero.
# Secrets usam sync:false e devem ser preenchidos apenas no painel seguro do Render.
services:
  - type: web
    runtime: node
    name: cyrnex-flow-api
    region: virginia
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: CYRNEX_RELEASE
        value: V11.7.2-RC1
      - key: CYRNEX_AUTH_PROVIDER
        value: supabase
      - key: PASSWORD_RECOVERY_DELIVERY
        value: smtp
      - key: PASSWORD_RECOVERY_CODE_MINUTES
        value: "10"
      - key: PASSWORD_RECOVERY_RESEND_SECONDS
        value: "60"
      - key: PASSWORD_RECOVERY_EXPOSE_CODE
        value: "false"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_REQUIRE_TLS
        value: "true"
      - key: CYRNEX_SLOW_REQUEST_MS
        value: "1800"
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CYRNEX_EXTERNAL_STATUS_URL
        sync: false

  - type: web
    runtime: static
    name: cyrnex-flow-web
    rootDir: web
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
